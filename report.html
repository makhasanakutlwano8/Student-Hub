<h2>🛠 Report an Issue</h2>

<p>Please complete the form below.</p>

<label>Full Name</label><br>
<input type="text" id="reportName" placeholder="Full Name"><br><br>

<label>Student Number</label><br>
<input type="text" id="reportStudentNumber" placeholder="Student Number"><br><br>

<label>Department</label><br>
<select id="department">
  <option value="">Select Department</option>
  <option>Maintenance</option>
  <option>Cleaning</option>
  <option>Transport</option>
  <option>Sports</option>
  <option>Health & Welfare</option>
</select><br><br>

<label>Issue</label><br>
<textarea id="issue"
rows="5"
placeholder="Describe the issue..."></textarea><br><br>

<label>Priority</label><br>
<select id="priority">
  <option>Low</option>
  <option selected>Medium</option>
  <option>High</option>
  <option>Emergency</option>
</select><br><br>

<button onclick="submitReport()">
📤 Submit Report
</button>

<br><br>

<div id="reportMessage"></div>
